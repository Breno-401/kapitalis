<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#051529" />
    <meta
      name="description"
      content="Kapitalis Contabilidade & BPO Financeiro, em Vila Velha — ES."
    />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>Kapitalis | Contabilidade &amp; BPO Financeiro</title>
    <script>
      (() => {
        let theme = 'dark'
        try {
          const savedTheme = localStorage.getItem('kapitalis-theme')
          if (savedTheme === 'light' || savedTheme === 'dark') {
            theme = savedTheme
          } else if (window.matchMedia('(prefers-color-scheme: light)').matches) {
            theme = 'light'
          }
        } catch {
          // Use the dark palette when browser preferences cannot be read.
        }
        document.documentElement.dataset.theme = theme
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
